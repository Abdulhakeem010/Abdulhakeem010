<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Astronaut floating in space" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="300" height="300" fill="#000000"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="22" cy="30" r="1.2"/><circle cx="70" cy="18" r="0.9"/><circle cx="118" cy="40" r="1.4"/>
    <circle cx="190" cy="22" r="1"/><circle cx="250" cy="48" r="1.3"/><circle cx="278" cy="110" r="0.9"/>
    <circle cx="30" cy="96" r="1"/><circle cx="52" cy="160" r="1.3"/><circle cx="16" cy="220" r="0.9"/>
    <circle cx="84" cy="262" r="1.2"/><circle cx="150" cy="282" r="1"/><circle cx="214" cy="266" r="1.4"/>
    <circle cx="268" cy="228" r="1"/><circle cx="244" cy="170" r="0.9"/><circle cx="226" cy="92" r="1.1"/>
    <circle cx="96" cy="86" r="0.8"/><circle cx="176" cy="60" r="0.8"/><circle cx="60" cy="214" r="0.8"/>
    <circle cx="286" cy="286" r="1"/><circle cx="130" cy="236" r="0.8"/>
  </g>

  <!-- astronaut -->
  <g transform="rotate(-20 150 150)">
    <!-- backpack -->
    <rect x="116" y="120" width="68" height="84" rx="12" fill="#8a8a8a"/>
    <!-- legs -->
    <rect x="128" y="188" width="19" height="48" rx="9.5" fill="#d6d6d6" transform="rotate(14 137 188)"/>
    <rect x="153" y="188" width="19" height="48" rx="9.5" fill="#cfcfcf" transform="rotate(-22 162 188)"/>
    <!-- arms -->
    <rect x="92" y="134" width="40" height="15" rx="7.5" fill="#dcdcdc" transform="rotate(-28 128 141)"/>
    <rect x="168" y="140" width="40" height="15" rx="7.5" fill="#dcdcdc" transform="rotate(32 172 147)"/>
    <!-- torso -->
    <rect x="124" y="128" width="52" height="68" rx="16" fill="#ececec"/>
    <rect x="138" y="146" width="24" height="16" rx="3" fill="#9c9c9c"/>
    <!-- helmet -->
    <circle cx="150" cy="106" r="31" fill="#f4f4f4"/>
    <ellipse cx="152" cy="107" rx="21" ry="16" fill="#111111"/>
    <ellipse cx="145" cy="101" rx="7" ry="3" fill="#6a6a6a" opacity="0.8"/>
  </g>
</svg>
