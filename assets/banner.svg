<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Welcome to Abdulhakeem's Github" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#151515"/>
      <stop offset="1" stop-color="#7a7a7a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#8f8f8f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- far dunes -->
  <path d="M0 290 C200 240 400 275 620 250 S1000 235 1200 275 L1200 420 L0 420 Z" fill="#3b3b3b"/>
  <!-- mid dunes -->
  <path d="M0 335 C250 285 460 325 700 295 S1060 295 1200 325 L1200 420 L0 420 Z" fill="#1c1c1c"/>
  <!-- winding river -->
  <path d="M575 268 C625 288 540 318 650 348 S570 396 700 420 L520 420 C470 392 565 362 480 338 S520 292 575 268 Z" fill="url(#river)" opacity="0.85"/>
  <!-- front dunes -->
  <path d="M0 392 C300 352 500 402 800 372 S1100 362 1200 382 L1200 420 L0 420 Z" fill="#000000"/>

  <text x="600" y="130" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="36" letter-spacing="2" fill="#ffffff">Welcome to Abdulhakeem's Github &lt;/&gt;</text>
</svg>
